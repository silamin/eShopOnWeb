version: '3.4'
services:
 eshopwebmvc:
   environment:
     - ASPNETCORE_ENVIRONMENT=Docker
     - ASPNETCORE_URLS=http://+:8080
     - CatalogService__BaseUrl=http://catalogservice:8080/
     # The monolith keeps its own two databases and still connects as sa (it creates and migrates them).
     - ConnectionStrings__CatalogConnection=Server=sqlserver,1433;Initial Catalog=Microsoft.eShopOnWeb.CatalogDb;User Id=sa;Password=${SQL_SA_PASSWORD:?copy .env.example to .env};TrustServerCertificate=true;
     - ConnectionStrings__IdentityConnection=Server=sqlserver,1433;Initial Catalog=Microsoft.eShopOnWeb.Identity;User Id=sa;Password=${SQL_SA_PASSWORD:?copy .env.example to .env};TrustServerCertificate=true;
     - Jwt__Key=${JWT_KEY:?copy .env.example to .env}
     # Checkout publishes BasketCheckedOut to the Ordering service.
     - RABBITMQ_HOST=rabbitmq
     - RABBITMQ_USER=${RABBITMQ_USER:?copy .env.example to .env}
     - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?copy .env.example to .env}
     - RABBITMQ_VHOST=${RABBITMQ_VHOST:?copy .env.example to .env}
   volumes:
     - ~/.aspnet/https:/root/.aspnet/https:ro
     - ~/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro
 eshoppublicapi:
   environment:
     - ASPNETCORE_ENVIRONMENT=Docker
     - ASPNETCORE_URLS=http://+:8080
     - ConnectionStrings__CatalogConnection=Server=sqlserver,1433;Initial Catalog=Microsoft.eShopOnWeb.CatalogDb;User Id=sa;Password=${SQL_SA_PASSWORD:?copy .env.example to .env};TrustServerCertificate=true;
     - ConnectionStrings__IdentityConnection=Server=sqlserver,1433;Initial Catalog=Microsoft.eShopOnWeb.Identity;User Id=sa;Password=${SQL_SA_PASSWORD:?copy .env.example to .env};TrustServerCertificate=true;
     - Jwt__Key=${JWT_KEY:?copy .env.example to .env}
   volumes:
     - ~/.aspnet/https:/root/.aspnet/https:ro
     - ~/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro
 gateway:
   environment:
     - ASPNETCORE_ENVIRONMENT=Docker
     - ASPNETCORE_URLS=http://+:8080
     - Jwt__Key=${JWT_KEY:?copy .env.example to .env}
   ports:
     - "5100:8080"
 catalogservice:
   environment:
     - ASPNETCORE_ENVIRONMENT=Docker
     - ASPNETCORE_URLS=http://+:8080
     - ConnectionStrings__CatalogConnection=Server=sqlserver,1433;Database=eShop.CatalogServiceDb;User Id=catalog_svc;Password=${CATALOG_DB_PASSWORD:?copy .env.example to .env};TrustServerCertificate=true;Encrypt=false
     - Jwt__Key=${JWT_KEY:?copy .env.example to .env}
     - CatalogBaseUrl=
     - RABBITMQ_HOST=rabbitmq
     - RABBITMQ_USER=${RABBITMQ_USER:?copy .env.example to .env}
     - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?copy .env.example to .env}
     - RABBITMQ_VHOST=${RABBITMQ_VHOST:?copy .env.example to .env}
 inventoryservice:
   environment:
     - ASPNETCORE_ENVIRONMENT=Docker
     - ASPNETCORE_URLS=http://+:8080
     - ConnectionStrings__InventoryConnection=Server=sqlserver,1433;Database=eShop.InventoryDb;User Id=inventory_svc;Password=${INVENTORY_DB_PASSWORD:?copy .env.example to .env};TrustServerCertificate=true;Encrypt=false
     - Jwt__Key=${JWT_KEY:?copy .env.example to .env}
     # Starting quantity of a new stock line. The code default is 0 (the honest real-world value); 10 for the demo.
     - INVENTORY_STARTING_QUANTITY=10
     - RABBITMQ_HOST=rabbitmq
     - RABBITMQ_USER=${RABBITMQ_USER:?copy .env.example to .env}
     - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?copy .env.example to .env}
     - RABBITMQ_VHOST=${RABBITMQ_VHOST:?copy .env.example to .env}
 orderingservice:
   environment:
     - ASPNETCORE_ENVIRONMENT=Docker
     - ASPNETCORE_URLS=http://+:8080
     - ConnectionStrings__OrderingConnection=Server=sqlserver,1433;Database=eShop.OrderingDb;User Id=ordering_svc;Password=${ORDERING_DB_PASSWORD:?copy .env.example to .env};TrustServerCertificate=true;Encrypt=false
     - Jwt__Key=${JWT_KEY:?copy .env.example to .env}
     - RABBITMQ_HOST=rabbitmq
     - RABBITMQ_USER=${RABBITMQ_USER:?copy .env.example to .env}
     - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?copy .env.example to .env}
     - RABBITMQ_VHOST=${RABBITMQ_VHOST:?copy .env.example to .env}
 paymentservice:
   environment:
     - ASPNETCORE_ENVIRONMENT=Docker
     - ASPNETCORE_URLS=http://+:8080
     - ConnectionStrings__PaymentConnection=Server=sqlserver,1433;Database=eShop.PaymentDb;User Id=payment_svc;Password=${PAYMENT_DB_PASSWORD:?copy .env.example to .env};TrustServerCertificate=true;Encrypt=false
     # Simulated payment: an order total above this is declined (PaymentFailed -> the order is cancelled and
     # the stock released). Code default 1000; 100 for the demo, so 6 x a 19.50 sweatshirt (117.00) is declined.
     - PAYMENT_DECLINE_ABOVE=100
     - RABBITMQ_HOST=rabbitmq
     - RABBITMQ_USER=${RABBITMQ_USER:?copy .env.example to .env}
     - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?copy .env.example to .env}
     - RABBITMQ_VHOST=${RABBITMQ_VHOST:?copy .env.example to .env}
 sql-init:
   environment:
     - SA_PASSWORD=${SQL_SA_PASSWORD:?copy .env.example to .env}
     - CATALOG_DB_NAME=eShop.CatalogServiceDb
     - CATALOG_DB_USER=catalog_svc
     - CATALOG_DB_PASSWORD=${CATALOG_DB_PASSWORD:?copy .env.example to .env}
     - INVENTORY_DB_NAME=eShop.InventoryDb
     - INVENTORY_DB_USER=inventory_svc
     - INVENTORY_DB_PASSWORD=${INVENTORY_DB_PASSWORD:?copy .env.example to .env}
     - ORDERING_DB_NAME=eShop.OrderingDb
     - ORDERING_DB_USER=ordering_svc
     - ORDERING_DB_PASSWORD=${ORDERING_DB_PASSWORD:?copy .env.example to .env}
     - PAYMENT_DB_NAME=eShop.PaymentDb
     - PAYMENT_DB_USER=payment_svc
     - PAYMENT_DB_PASSWORD=${PAYMENT_DB_PASSWORD:?copy .env.example to .env}
 rabbitmq:
   environment:
     # The image creates only this user (no guest) and this vhost; the user gets rights on that vhost only.
     - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?copy .env.example to .env}
     - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?copy .env.example to .env}
     - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:?copy .env.example to .env}
   ports:
     # AMQP (5672) is NOT published: services reach the broker on the compose network only.
     # The management UI is published on the loopback interface only, so it is reachable from this
     # machine (http://localhost:15672) and from nowhere else.
     - "127.0.0.1:15672:15672"
 event-probe:
   environment:
     - RABBITMQ_HOST=rabbitmq
     - RABBITMQ_USER=${RABBITMQ_USER:?copy .env.example to .env}
     - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?copy .env.example to .env}
     - RABBITMQ_VHOST=${RABBITMQ_VHOST:?copy .env.example to .env}
